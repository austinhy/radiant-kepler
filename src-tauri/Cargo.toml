[package]
name = "radiant-kepler"
version = "1.0.0"
description = "Radiant Kepler - Fast Crypto Market Intelligence & Good-Faith Prediction Desktop App"
authors = ["Radiant Kepler"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
